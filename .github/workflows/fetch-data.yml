name: Fetch Market Data

on:
  schedule:
    # GitHub schedules run in UTC. UK time is UTC+0 in winter (GMT) and UTC+1 in summer (BST),
    # so both UTC times are listed and the "Check UK time" step keeps only the right ones.
    - cron: '45 16 * * 1-5'   # 16:45 UK in winter (GMT)
    - cron: '45 15 * * 1-5'   # 16:45 UK in summer (BST)
    - cron: '25 21 * * 1-5'   # 21:25 UK in winter (GMT)
    - cron: '25 20 * * 1-5'   # 21:25 UK in summer (BST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check UK time
        id: uk
        run: |
          OFFSET=$(TZ=Europe/London date +%z)
          SCHED="${{ github.event.schedule }}"
          RUN=true
          if [ -n "$SCHED" ]; then
            if [ "$OFFSET" = "+0000" ]; then
              case "$SCHED" in "45 16 * * 1-5"|"25 21 * * 1-5") RUN=true ;; *) RUN=false ;; esac
            else
              case "$SCHED" in "45 15 * * 1-5"|"25 20 * * 1-5") RUN=true ;; *) RUN=false ;; esac
            fi
          fi
          echo "UK offset $OFFSET, schedule '$SCHED', run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Checkout repo
        if: steps.uk.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.uk.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.uk.outputs.run == 'true'
        run: pip install yfinance requests pandas beautifulsoup4

      - name: Run data fetcher
        if: steps.uk.outputs.run == 'true'
        run: python fetch_data.py
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}

      - name: Commit & push data.json
        if: steps.uk.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --staged --quiet || git commit -m "chore: refresh market data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
